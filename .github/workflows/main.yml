name: Build and Release PBO

on:
  push:
    branches:
      - master-altis
      
jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download and unzip PBO Manager
        run: |
          Invoke-WebRequest -Uri https://github.com/winseros/pboman3/releases/download/v1.9.1/PBOManager-binaries-1.9.1-200.39e75de.zip -OutFile pbomanager.zip
          Expand-Archive -Path pbomanager.zip -DestinationPath pbomanager
          Rename-Item "pbomanager\PBOManager-binaries-1.9.1-200.39e75de\PBO Manager" "PBOManager"
          
      - name: Build PBO
        run: |
          .\pbomanager\PBOManager-binaries-1.9.1-200.39e75de\PBOManager\pboc.exe pack warlordsredux.altis --output-directory .
          
      - name: Upload PBO to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: warlordsredux.altis.pbo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
